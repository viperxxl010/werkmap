name: EisenFlow
options:
  bundleIdPrefix: com.eisenflow
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""

targets:
  EisenFlow:
    type: application
    platform: macOS
    sources:
      - EisenFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eisenflow.app
        PRODUCT_NAME: EisenFlow
        INFOPLIST_FILE: EisenFlow/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: EisenFlow/EisenFlow.entitlements
    entitlements:
      path: EisenFlow/EisenFlow.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
